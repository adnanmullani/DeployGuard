name: DeployGuard (self review)
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          fail-on: high
          exclude: examples/
