# Intentionally risky demo manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: myorg/api:latest
          securityContext:
            privileged: true
